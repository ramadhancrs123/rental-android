name: Android Release CI/CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set"
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Decode google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            echo "google-services.json not provided - Firebase sync will be skipped"
          fi

      - name: Run Lint & Unit Tests
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Build Signed Release APK & AAB
        run: ./gradlew clean assembleRelease bundleRelease --no-daemon

      - name: Verify APK Signature
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK_PATH"

      - name: Rename Artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "RentalOutdoor-${VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "RentalOutdoor-${VERSION}.aab"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            RentalOutdoor-*.apk
            RentalOutdoor-*.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RentalOutdoor-*.apk
            RentalOutdoor-*.aab
          draft: false
          prerelease: false
          generate_release_notes: true
